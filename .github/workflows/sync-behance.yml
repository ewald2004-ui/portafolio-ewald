name: Sincronizar con Behance

on:
  schedule:
    # Todos los días a las 08:00 UTC (05:00 en Chile).
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-behance
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer Behance y regenerar datos
        run: python3 scripts/sync_behance.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/projects
          if git diff --cached --quiet; then
            echo "Sin cambios: el portafolio ya está al día."
            exit 0
          fi
          git commit -m "chore: sincronizar proyectos de Behance"
          git push
